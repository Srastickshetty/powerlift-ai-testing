version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: powerlift-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-powerlift_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-powerlift_prod}
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - powerlift-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-powerlift_admin} -d ${POSTGRES_DB:-powerlift_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: powerlift-prod-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-powerlift_redis_secret} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - powerlift-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-powerlift_redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: powerlift-prod-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-powerlift_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-powerlift_prod}?connection_limit=30&pool_timeout=10
      REDIS_URL: redis://:${REDIS_PASSWORD:-powerlift_redis_secret}@redis:6379/0
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - powerlift-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 384M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: powerlift-prod-web
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - powerlift-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

networks:
  powerlift-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
